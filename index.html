<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tía Paolaaaa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fondo de destellos -->
  <div class="sparkles" id="sparkles"></div>

  <!-- Contenedor para la lluvia de pétalos -->
  <div id="petalsContainer"></div>

  <div class="main-card">
    <h1>Un detalle para vos, cositaa ✨</h1>

    <div class="canvas-container">
      <!-- RAMO DE ROSAS MORADAS (SVG) -->
      <div class="bouquet-wrapper" id="bouquetWrapper">
        <svg id="bouquetSvg" viewBox="0 0 300 350">
          <!-- TALLOS Y HOJAS -->
          <g stroke="#3a5a40" stroke-width="4" stroke-linecap="round">
            <path d="M 150 220 Q 140 280 120 330" />
            <path d="M 150 220 Q 150 280 150 330" />
            <path d="M 150 220 Q 160 280 180 330" />
          </g>
          <path d="M 130 260 Q 100 250 115 230 Q 135 245 130 260 Z" fill="#3a5a40" />
          <path d="M 170 260 Q 200 250 185 230 Q 165 245 170 260 Z" fill="#3a5a40" />

          <!-- LAZO Y ENVOLTURA -->
          <path d="M 110 240 L 190 240 L 165 320 L 135 320 Z" fill="#240046" opacity="0.8" stroke="#7b2cbf" stroke-width="2" />
          <path d="M 150 240 Q 135 255 120 250 Q 135 235 150 240 Z" fill="#9d4edd" />
          <path d="M 150 240 Q 165 255 180 250 Q 165 235 150 240 Z" fill="#9d4edd" />
          <circle cx="150" cy="240" r="6" fill="#ffd700" />

          <!-- ROSAS -->
          <!-- Rosa Izquierda -->
          <g transform="translate(95, 130)">
            <path class="petal petal-outer" d="M -25 -5 C -35 -25 -10 -40 0 -25 C 10 -40 35 -25 25 -5 C 35 15 0 30 0 30 C 0 30 -35 15 -25 -5 Z" fill="#5a189a" />
            <path class="petal petal-inner" d="M -18 -5 C -25 -20 -5 -30 0 -18 C 5 -30 25 -20 18 -5 C 25 10 0 20 0 20 C 0 20 -25 10 -18 -5 Z" fill="#7b2cbf" />
            <circle cx="0" cy="-5" r="8" fill="#9d4edd" />
          </g>

          <!-- Rosa Derecha -->
          <g transform="translate(205, 130)">
            <path class="petal petal-outer" d="M -25 -5 C -35 -25 -10 -40 0 -25 C 10 -40 35 -25 25 -5 C 35 15 0 30 0 30 C 0 30 -35 15 -25 -5 Z" fill="#5a189a" />
            <path class="petal petal-inner" d="M -18 -5 C -25 -20 -5 -30 0 -18 C 5 -30 25 -20 18 -5 C 25 10 0 20 0 20 C 0 20 -25 10 -18 -5 Z" fill="#7b2cbf" />
            <circle cx="0" cy="-5" r="8" fill="#9d4edd" />
          </g>

          <!-- Rosa Centro Principal -->
          <g transform="translate(150, 95)">
            <path class="petal petal-outer" d="M -32 -8 C -45 -32 -12 -50 0 -32 C 12 -50 45 -32 32 -8 C 45 20 0 38 0 38 C 0 38 -45 20 -32 -8 Z" fill="#7b2cbf" />
            <path class="petal petal-inner" d="M -22 -6 C -30 -24 -8 -36 0 -22 C 8 -36 30 -24 22 -6 C 30 12 0 26 0 26 C 0 26 -30 12 -22 -6 Z" fill="#9d4edd" />
            <circle cx="0" cy="-6" r="10" fill="#c77dff" />
          </g>

          <!-- Rosa Arriba -->
          <g transform="translate(150, 45)">
            <path class="petal petal-outer" d="M -20 -4 C -28 -20 -8 -32 0 -20 C 8 -32 28 -20 20 -4 C 28 12 0 24 0 24 C 0 24 -28 12 -20 -4 Z" fill="#9d4edd" />
            <path class="petal petal-inner" d="M -14 -4 C -20 -15 -5 -24 0 -14 C 5 -24 20 -15 14 -4 C 20 8 0 16 0 16 C 0 16 -20 8 -14 -4 Z" fill="#c77dff" />
            <circle cx="0" cy="-4" r="6" fill="#e0aaff" />
          </g>
        </svg>
      </div>

      <!-- SOBRE OCULTO -->
      <div class="envelope-wrapper hidden" id="envelopeWrapper">
        <div class="envelope" id="envelope">
          <div class="front flap"></div>
          <div class="front pocket"></div>
          <div class="letter">
            <p class="letter-text">Te amo mucho Pao 🥰</p>
          </div>
          <div class="heart-seal">💜</div>
        </div>
      </div>
    </div>

    <!-- Botón principal -->
    <button id="btnAction">Dale click aquiii 🌸</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
